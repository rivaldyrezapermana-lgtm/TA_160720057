<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Rak gantung workshop Labasa berisi gamis, koko, dan tunik">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.6" stop-color="#eef2f6"/>
      <stop offset="1" stop-color="#dfe6ed"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="0.55" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="sage" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="0.55" stop-color="#059669"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#fdfbf6"/>
      <stop offset="0.55" stop-color="#f3ecdd"/>
      <stop offset="1" stop-color="#e4d9c2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 4h8M4 0v8" stroke="#0f172a" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="1000" fill="url(#ground)"/>
  <rect width="800" height="1000" fill="url(#weave)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>

  <!-- rail -->
  <rect x="66" y="162" width="668" height="9" rx="4.5" fill="#94a3b8"/>
  <rect x="66" y="162" width="668" height="4" rx="2" fill="#cbd5e1"/>
  <rect x="72" y="96" width="8" height="70" rx="4" fill="#b6c2d0"/>
  <rect x="720" y="96" width="8" height="70" rx="4" fill="#b6c2d0"/>

  <!-- floor shadows -->
  <ellipse cx="215" cy="726" rx="96" ry="17" fill="#0f172a" opacity="0.07"/>
  <ellipse cx="400" cy="666" rx="94" ry="16" fill="#0f172a" opacity="0.07"/>
  <ellipse cx="585" cy="607" rx="92" ry="16" fill="#0f172a" opacity="0.07"/>

  <!-- hangers -->
  <g fill="none" stroke="#8b98a8" stroke-width="5" stroke-linecap="round">
    <path d="M215,171 v18"/><path d="M176,203 l39,-16 l39,16"/>
    <path d="M400,171 v18"/><path d="M361,203 l39,-16 l39,16"/>
    <path d="M585,171 v18"/><path d="M546,203 l39,-16 l39,16"/>
  </g>

  <!-- gamis, navy -->
  <g fill="url(#navy)">
    <path id="h-slv-a" d="M150,234 c-19,7 -31,21 -34,40 l-14,110 c-2,9 5,17 14,17 h22 c9,0 16,-7 16,-16 l12,-142 z"/>
    <use href="#h-slv-a" transform="matrix(-1 0 0 1 430 0)"/>
    <path d="M215,206 c-14,0 -27,6 -36,14 l-29,13 c-10,4 -15,14 -16,25 l-19,442 c-1,10 7,19 17,19 h166 c10,0 18,-9 17,-19 l-19,-442 c-1,-11 -6,-21 -16,-25 l-29,-13 c-9,-8 -22,-14 -36,-14 z"/>
  </g>
  <path d="M215,207 c-16,0 -28,10 -28,23 c0,11 13,19 28,19 s28,-8 28,-19 c0,-13 -12,-23 -28,-23 z" fill="#e6ebf1"/>
  <path d="M215,250 v465" stroke="#f8fafc" stroke-opacity="0.12" stroke-width="2"/>

  <!-- koko, sage -->
  <g fill="url(#sage)">
    <path id="h-slv-b" d="M335,234 c-19,7 -31,21 -34,40 l-12,96 c-2,9 5,17 14,17 h22 c9,0 16,-7 16,-16 l10,-128 z"/>
    <use href="#h-slv-b" transform="matrix(-1 0 0 1 800 0)"/>
    <path d="M400,206 c-14,0 -27,6 -36,14 l-29,13 c-10,4 -15,14 -16,25 l-17,382 c-1,10 7,19 17,19 h162 c10,0 18,-9 17,-19 l-17,-382 c-1,-11 -6,-21 -16,-25 l-29,-13 c-9,-8 -22,-14 -36,-14 z"/>
  </g>
  <path d="M400,207 c-15,0 -26,9 -26,21 c0,10 12,18 26,18 s26,-8 26,-18 c0,-12 -11,-21 -26,-21 z" fill="#e6ebf1"/>
  <path d="M373,216 l27,37 l27,-37 l16,7 l-43,53 l-43,-53 z" fill="#ecfdf5" fill-opacity="0.3"/>
  <path d="M400,253 v402" stroke="#ecfdf5" stroke-opacity="0.28" stroke-width="2.5"/>
  <g fill="#ecfdf5" fill-opacity="0.5">
    <circle cx="400" cy="306" r="4.5"/><circle cx="400" cy="358" r="4.5"/><circle cx="400" cy="410" r="4.5"/>
  </g>

  <!-- tunik, cream -->
  <g fill="url(#cream)" stroke="#c3b89f" stroke-width="1.6" stroke-linejoin="round">
    <path id="h-slv-c" d="M520,234 c-19,7 -31,21 -34,40 l-9,74 c-2,9 5,17 14,17 h22 c9,0 16,-7 16,-16 l7,-106 z"/>
    <use href="#h-slv-c" transform="matrix(-1 0 0 1 1170 0)"/>
    <path d="M585,206 c-14,0 -27,6 -36,14 l-29,13 c-10,4 -15,14 -16,25 l-15,323 c-1,10 7,19 17,19 h158 c10,0 18,-9 17,-19 l-15,-323 c-1,-11 -6,-21 -16,-25 l-29,-13 c-9,-8 -22,-14 -36,-14 z"/>
  </g>
  <path d="M585,207 c-16,0 -28,10 -28,23 c0,11 13,19 28,19 s28,-8 28,-19 c0,-13 -12,-23 -28,-23 z" fill="#dbe2ea" stroke="#c3b89f" stroke-width="1.6"/>
  <path d="M585,252 v344" stroke="#c3b89f" stroke-opacity="0.4" stroke-width="1.6"/>
</svg>
